name: Quality Gates

# Every pull request and every push to a long-lived branch must pass the harness gates.
# Local equivalent: `bash scripts/harness/check-all.sh` (see docs/harness/gates.md).
#
# Design notes:
# - ubuntu-latest runs the cheap gates; the Rust job needs macos-latest because tray and
#   accessibility code is #[cfg(target_os = "macos")]-gated.
# - `npm ci` is used without --ignore-scripts: the local EALLOWSCRIPTS failure documented
#   in docs/harness/DECISIONS.md (D-007) is caused by a developer's user-level npmrc, which
#   CI runners do not have.
# - Blocking a PR is intentional; see docs/harness/DEBT-BASELINE.md for the exemptions that
#   keep the gates green on pre-existing debt.

on:
  pull_request:
  push:
    branches:
      - main
      - harnessing
  schedule:
    # Weekly, Monday 06:00 UTC: the advisory database changes without this repository
    # changing, so a trigger is needed that does not depend on anyone committing.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Cheap, fast gates. Target: under 5 minutes.
  # ---------------------------------------------------------------------------
  quality:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Gate — repository hygiene
        run: bash scripts/harness/check-hygiene.sh

      - name: Gate — static metrics (informational)
        run: bash scripts/harness/scan.sh

      - name: Gate — IPC contract drift
        run: node scripts/harness/gen-ipc-contract.mjs --check

      - name: Gate — documentation links and staleness
        run: bash scripts/harness/docs-lint.sh

      - name: Gate — ISSUE references
        run: node scripts/harness/check-issue-refs.mjs

      - name: Gate — ESLint (ratchet)
        run: node scripts/harness/lint-ratchet.mjs

      - name: Gate — Prettier formatting
        run: npx prettier --check . --ignore-path .prettierignore

      - name: Gate — TypeScript (advisory until W4a)
        # 408 pre-existing errors, almost all in the 191 unreachable source files
        # (ISSUE-030). This step reports but does not block; it becomes a hard gate when
        # wave W4a deletes the dead code. See docs/harness/DEBT-BASELINE.md §3.
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.json

  # ---------------------------------------------------------------------------
  # Rust. Compiles Tauri, so it is the slow job.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Gate — rustfmt
        # Checks each file individually rather than `cargo fmt --check`, so the generated
        # src/schema.rs (4-space indent, from `diesel print-schema`) can be skipped on
        # stable rustfmt and src-tauri/libs/** stays out of scope. See gates.md.
        run: bash scripts/harness/check-rustfmt.sh

      - name: Gate — clippy (ratchet)
        # Counts only clippy::* lints in this crate and fails on an increase over
        # docs/harness/clippy-baseline.json, rather than on the ~650 warnings the crate
        # emits overall (mostly rustc lints and dependency noise).
        run: node scripts/harness/clippy-ratchet.mjs

      - name: Gate — cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ---------------------------------------------------------------------------
  # Frontend tests and the coverage ratchet.
  # ---------------------------------------------------------------------------
  tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Gate — vitest + coverage ratchet
        # Coverage may only go up against docs/harness/coverage-baseline.json.
        run: bash scripts/harness/run-tests.sh --coverage

      - name: Gate — production build
        # The build is the only automated proof that the frontend still compiles and that
        # the three Vite entries resolve. It is also the safety check for wave W4a
        # (deleting unreachable code), where a dynamic import the static walker cannot see
        # would otherwise delete live code.
        run: cd packages/pastebar-app-ui && npx vite build

  # ---------------------------------------------------------------------------
  # Dependency advisories. Runs on a schedule rather than on every PR, because the
  # pre-existing advisory count (ISSUE-032: 51 production, 30 high) must not block
  # unrelated work — but it must not be invisible either, which is how it went
  # un-audited for the life of the repository.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency advisories
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production advisories (strict)
        # Fails on ANY high/critical production advisory, so the debt surfaces on a timer.
        # `--strict` is deliberately not in check-all.sh: a PR should not go red for debt it
        # did not introduce. See docs/harness/gates.md gate 7b.
        continue-on-error: true
        run: node scripts/harness/audit-ratchet.mjs --strict

      - name: Ratchet regression check
        # This one DOES block: it fails only if the count grew past the baseline.
        run: node scripts/harness/audit-ratchet.mjs

      - name: Report (for the job summary)
        if: always()
        run: node scripts/harness/audit-ratchet.mjs --report
