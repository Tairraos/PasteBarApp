# PasteBar rustfmt configuration.
#
# `schema.rs` is generated by `diesel print-schema`, which emits 4-space indentation and
# offers no hook to change it. That file carries `#![rustfmt::skip]` internally and is left
# exactly as Diesel writes it, so regeneration produces no spurious diff.
# Regenerate with: diesel print-schema > src/schema.rs   (run from src-tauri/)
tab_spaces = 2
