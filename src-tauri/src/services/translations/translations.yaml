# Tray-menu strings, translated in Rust.
#
# Separate from the frontend's locale catalogs (`packages/pastebar-app-ui/src/locales/lang`)
# because the tray is built in Rust and must render before any webview exists — it cannot
# call into i18next. Only the handful of labels the tray shows live here.
#
# Chinese only, matching the product decision for the UI. `en` is retained as the fallback
# for an unknown or unset language: without it, a missing language code would print
# "Language 'x' not supported." into a menu item.
en:
  add_first_item_here: Add First Item Here
  disable_history_capture: Disable History Capture
  enable_history_capture: Enable History Capture
  clipboard_image_size: Clipboard Image size
  history_capture_is_disabled: Clipboard History Capture is Disabled
  recent_history: Recent History
  open_pastebar: Open PasteBar
  unlock_pastebar: Unlock PasteBar
  quit: Quit

zhCN:
  add_first_item_here: 在此添加第一个项目
  disable_history_capture: 禁用历史记录捕获
  enable_history_capture: 启用历史记录捕获
  clipboard_image_size: 剪贴板图像大小
  history_capture_is_disabled: 剪贴板历史记录捕获已禁用
  recent_history: 最近的历史记录
  open_pastebar: 打开 PasteBar
  unlock_pastebar: 解锁 PasteBar
  quit: 退出
